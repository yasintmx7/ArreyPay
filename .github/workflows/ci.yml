name: CI

on:
  push:
    branches: [master, professionalize-arreypay]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Check tracked sensitive files
        shell: bash
        run: |
          sensitive=$(git ls-files | grep -E '(^|/)(\.env$|\.env\.(local|production|development|test)$|\.test-wallet\.json$|.*\.pem$|.*\.key$)' || true)
          if [ -n "$sensitive" ]; then
            echo "$sensitive"
            echo "Sensitive file detected in git index"
            exit 1
          fi
