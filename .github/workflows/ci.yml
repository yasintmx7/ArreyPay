name: CI

on:
  push:
    branches: [master, professionalize-arreypay]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Check tracked sensitive files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|\.test-wallet\.json$|.*\.pem$|.*\.key$)'; then
            echo "Sensitive file detected in git index"
            exit 1
          fi
